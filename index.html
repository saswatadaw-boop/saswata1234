<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Website</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        header{
            background:#0078d7;
            color:white;
            padding:20px;
            text-align:center;
        }

        nav{
            background:#005fa3;
            padding:10px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
        }

        .hero{
            padding:60px;
            text-align:center;
            background:white;
        }

        .hero h1{
            margin-bottom:15px;
        }

        .hero button{
            padding:10px 20px;
            background:#0078d7;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .content{
            padding:40px;
            text-align:center;
        }

        footer{
            background:#333;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:20px;
        }
    </style>
</head>
<body>

<header>
    <h1>My Website</h1>
    <p>Welcome to my first HTML website</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</nav>

<section class="hero">
    <h1>Hello World!</h1>
    <p>This is a simple HTML website.</p>
    <button onclick="alert('Welcome!')">Click Me</button>
</section>

<section class="content">
    <h2>About Us</h2>
    <p>
        This website was created using HTML, CSS, and JavaScript.
    </p>
</section>

<footer>
    <p>&copy; 2026 My Website. All Rights Reserved.</p>
</footer>

</body>
</html>
